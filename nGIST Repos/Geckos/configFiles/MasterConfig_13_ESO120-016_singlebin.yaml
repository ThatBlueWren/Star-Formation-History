# This is a test config file
GENERAL :
  RUN_ID : 'ESO120-016_iDR1_SN50_2.5_LW_4750-8900_singlebin' # Name of the analysis run. A subdirectory of this name within the output directory will be created. This identifier further serves as a prefix to all output files.
  INPUT : '13_ESO120-016/ESO120-016_DATACUBE_iDR1.fits' # Input file for this analysis run. The specified path is relative to the input path given in defaultDir.
  OUTPUT : 13_ESO120-016/ # Output directory. The output of this run will be collected in a subdirectory named RUN_ID. The specified path is relative to the output path given in defaultDir.
  REDSHIFT : 0.012255 # Initial guess on the redshift of the system [in z]. Spectra are shifted to rest-frame, according to this redshift.
  PARALLEL: True # Use multiprocessing [True/False]
  NCPU : 7 # Number of cores to use for multiprocessing
  LSF_DATA : 'lsf_MUSE-WFM' # Path of the file specifying the line-spread-function of the observational data. The specified path is relative to the configDir path in defaultDir.
  OW_CONFIG : True #  Ignore configurations from previous runs which are saved in the CONFIG file in the output directory [True/False]
  OW_OUTPUT : False # Overwrite any output files already present in the current output directory [True/False]

# Read data module 
READ_DATA : 
  METHOD : 'MUSE_WFM' 
  DEBUG : FALSE 
  ORIGIN : 220,290 
  LMIN_TOT : 4750 
  LMAX_TOT : 8900 
  LMIN_SNR : 4750 
  LMAX_SNR : 7000 
  EBmV : 0.048 

# Spatial masking module
SPATIAL_MASKING :
  METHOD : 'default' # Name of the routine in spatialMasking/ (without .py) to perform the tasks. Set 'False' to turn off module. Set 'default' to use the standard GIST implementation.
  MIN_SNR : 5 # Spaxels below the isophote level which has this mean signal-to-noise level are masked.
  MASK : 'ESO120-016_brightstar_mask.fits' # File containing a spatial mask (Set 'False' to not include a file)
  THRESHOLD_METHOD: 'isophote' # or 'isophote', 'isophote_gist', 'actual', 'isophote_smooth', 'actual_smooth'
  SMOOTH_SIGMA : 5 # Gaussian smoothing kernel (pixels), used only with 'isophote_smooth' or 'actual_smooth'

# Spatial binning module 
SPATIAL_BINNING : 
  METHOD : 'voronoi' 
  TARGET_SNR : 2500
  COVARIANCE : 0.0  
 
# Prepare spectra module 
PREPARE_SPECTRA : 
  METHOD : 'default' 
  VELSCALE : 41 
 
# Stellar kinematics module 
KIN : 
   METHOD : False
# Continuum Cube module 
CONT : 
  METHOD : False 

# Emission line fitting module 
GAS : 
  METHOD : False
  LEVEL : 'BIN'
 
# Star formation histories module 
SFH : 
  METHOD : False

 
# Line strenghts module 
LS : 
  METHOD : False
 
# User-defined module 
UMOD : 
  METHOD : False 
