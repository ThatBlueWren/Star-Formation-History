# This is a test config file
GENERAL :
  RUN_ID : 'ESO120-016_iDR1_SN50_2.5_LW_4750-8900_singlebin' # Name of the analysis run. A subdirectory of this name within the output directory will be created. This identifier further serves as a prefix to all output files.
  INPUT : '13_ESO120-016/ESO120-016_DATACUBE_iDR1.fits' # Input file for this analysis run. The specified path is relative to the input path given in defaultDir.
  OUTPUT : 13_ESO120-016/ # Output directory. The output of this run will be collected in a subdirectory named RUN_ID. The specified path is relative to the output path given in defaultDir.
  REDSHIFT : 0.012255 # Initial guess on the redshift of the system [in z]. Spectra are shifted to rest-frame, according to this redshift.
  PARALLEL: True # Use multiprocessing [True/False]
  NCPU : 7 # Number of cores to use for multiprocessing
  LSF_DATA : 'lsf_MUSE-WFM-MILES' # Path of the file specifying the line-spread-function of the observational data. The specified path is relative to the configDir path in defaultDir.
  OW_CONFIG : False #  Ignore configurations from previous runs which are saved in the CONFIG file in the output directory [True/False]
  OW_OUTPUT : False # Overwrite any output files already present in the current output directory [True/False]

# Read data module 
READ_DATA : 
  METHOD : 'MUSE_WFM' 
  DEBUG : FALSE 
  ORIGIN : 220,290 
  LMIN_TOT : 4750 
  LMAX_TOT : 8900 
  LMIN_SNR : 4750 
  LMAX_SNR : 7000 
  EBmV : 0.048 

# Spatial masking module
SPATIAL_MASKING :
  METHOD : 'default' # Name of the routine in spatialMasking/ (without .py) to perform the tasks. Set 'False' to turn off module. Set 'default' to use the standard GIST implementation.
  MIN_SNR : 5 # Spaxels below the isophote level which has this mean signal-to-noise level are masked.
  MASK : 'ESO120-016_brightstar_mask.fits' # File containing a spatial mask (Set 'False' to not include a file)
  THRESHOLD_METHOD: 'isophote' # or 'isophote', 'isophote_gist', 'actual', 'isophote_smooth', 'actual_smooth'
  SMOOTH_SIGMA : 5 # Gaussian smoothing kernel (pixels), used only with 'isophote_smooth' or 'actual_smooth'

# Spatial binning module 
SPATIAL_BINNING : 
  METHOD : 'voronoi' 
  TARGET_SNR : 2500
  COVARIANCE : 0.0  
 
# Prepare spectra module 
PREPARE_SPECTRA : 
  METHOD : 'default' 
  VELSCALE : 41 
 
# Stellar kinematics module 
KIN : 
   METHOD : False
   SIGMA : 130
# Continuum Cube module 
CONT : 
  METHOD : False 

# Emission line fitting module 
GAS : 
  METHOD : False
  LEVEL : 'BIN'
 
# Star formation histories module 
SFH : 
  METHOD : 'ppxf' # Name of the routine in starFormationHistories/ (without .py) to perform the tasks. Set 'False' to turn off module. Set 'ppxf' to use the standard GIST implementation, exploiting the pPXF routine of Cappellari & Emsellem (2004).
  LMIN : 4750 # Rest-frame wavelength range used for the star formation histories analysis [in Angst.]
  LMAX : 7000
  SPEC_DUSTMASK : 'specMask_DUST'
  SPEC_MASK : 'specMask_KIN' 
  SPEC_EMICLEAN : False # Keyword (True/False) to enable/disable the use of emission line cleaned spectra from the Emission Line Fitting Module.  
  MOM : 4 # Number of kinematic moments to be extracted. If you use FIXED = True, this should be same number of moments used to extract the stellar kinematics before. Otherwise the parameter can be set independently. 
  MDEG : 23 # Degree of the multiplicative Legendre polynomial. Set '0' to not include any multiplicative polynomials. Note that additive Legendre polynomials cannot be used for this module. 
  REGUL : 0 # Regularisation error for the regularised run of pPXF. Note: Regularisation = 1 / REGUL_ERR
  FIXED : False # Fix the stellar kinematics to the results obtained with the stellar kinematics module [True / False]. If 'False', please provide an initial guess on the velocity dispersion of the systems [in km/s] by adding the parameter SIGMA. 
  MC_PPXF : 0 # Added to add the option of running MC on the SFH module
  LSF_TEMP : 'lsf_MILES' # Path of the file specifying the line-spread-function of the spectral templates. The specified path is relative to the configDir path in defaultDir.
  TEMPLATE_SET : 'miles' # options are 'miles' or 'IndoUS' or 'walcher'
  LIBRARY : 'MILES/' # options are 'MILES/', 'miles_ssp_ch/', 'IndoUS', and 'Walcher/'
  NORM_TEMP : 'LIGHT' # Normalise the spectral template library to obtain light- or mass-weighted results [LIGHT / MASS]
  DOCLEAN : True # use pPXF clean routine which performs 3-sigma clipping based on the best-fit model [True / False]
  OPT_TEMP : 'default' # Keyword to select Optimal Template method. Options are 'default', 'galaxy_single', 'galaxy_set'
  DUST_CORR : False # True/False, fixes the dust in the final pPXF fit 
  NOISE : 'variance' # Keyword to set noise to be used in pPXF run. Option 'constant' and 'variance'
  PLOT : True # produce extra output plots
  DEBUG_BIN : [1] # Optional Keyword - array of bins [1,2,3] - only works when parallel = False. 

 
# Line strenghts module 
LS : 
  METHOD : False
 
# User-defined module 
UMOD : 
  METHOD : False 
