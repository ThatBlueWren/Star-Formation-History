# This is a test config file
GENERAL :
  RUN_ID : 'NGC0000_alphaMC_test' 
  INPUT : 'NGC0000.fits' 
  OUTPUT : ''
  REDSHIFT : 0.008399 
  PARALLEL: True 
  NCPU : 7 
  LSF_DATA : 'lsf_alphaMC_highres.txt' 
  OW_CONFIG : False 
  OW_OUTPUT : True
  CREATE_HTML: False

# Read data module
READ_DATA :
  METHOD : 'MUSE_WFM'
  DEBUG : False
  ORIGIN : 14,14 
  LMIN_TOT : 4700 
  LMAX_TOT : 8900
  LMIN_SNR : 4750 
  LMAX_SNR : 7000
  EBmV : null 

# Spatial masking module
SPATIAL_MASKING :
  METHOD : 'default' 
  MIN_SNR : 10
  MASK : 'NGC0000_mask.fits' 
  THRESHOLD_METHOD: 'isophote' # or 'isophote', 'isophote_gist', 'actual', 'isophote_smooth', 'actual_smooth'
  SMOOTH_SIGMA : 5.0 # Gaussian smoothing kernel (pixels), used only with 'isophote_smooth' or 'actual_smooth'
  
# Spatial binning module
SPATIAL_BINNING :
  METHOD : 'voronoi' 
  TARGET_SNR : 1200.0 
  COVARIANCE : 0.0 

# Prepare spectra module
PREPARE_SPECTRA :
  METHOD : 'default' 
  VELSCALE : 41 
  
# Stellar kinematics module
KIN :
  METHOD : False #'ppxf'
  SPEC_DUSTMASK : 'specMask_DUST'
  SPEC_MASK : 'specMask_KIN' 
  LMIN : 4750
  LMAX : 8900
  SIGMA : 100
  MOM : 4
  ADEG : 23
  MDEG : 1
  BIAS : 0.14 
  MC_PPXF : 0 
  LSF_TEMP : 'lsf_xsl_dr3' 
  TEMPLATE_SET : 'xsl_stars'  
  LIBRARY : 'xsl_dr3/' 
  NORM_TEMP : 'LIGHT' 
  DOCLEAN : True # use pPXF clean routine which performs 3-sigma clipping based on the best-fit model [True / False]
  OPT_TEMP : 'default' # Keyword to select Optimal Template method. Options are 'default', 'galaxy_single', 'galaxy_set'
  DUST_CORR : True # True/False, fixes the dust in the final pPXF fit 
  NOISE : 'variance' # Keyword to set noise to be used in pPXF run. Option 'constant' and 'variance'
  PLOT : True # produce extra output plots
  DEBUG_BIN : False # Optional Keyword - array of bins [1,2,3] - only works when parallel = False. 

# Continuum Cube module
CONT :
  METHOD : False # Name of the routine in stellarKinematics/ (without .py) to perform the tasks. Set 'False' to turn off module. Set 'ppxf' to use the standard GIST implementation, exploiting the pPXF routine of Cappellari & Emsellem (2004).
  SPEC_DUSTMASK : 'specMask_DUST'
  SPEC_MASK : 'specMask_KIN' 
  LMIN : 4750 # Rest-frame wavelength range used for the stellar kinematics analysis [in Angst.]
  LMAX : 8900
  SIGMA : 100 # Initial guess of the velocity dispersion of the system [in km/s]
  MOM : 4 # Number of kinematic moments to be extracted
  ADEG : 0 # Degree of the multiplicative Legendre polynomial. Set '0' to not include any multiplicative polynomials
  MDEG : 12 # Degree of the multiplicative Legendre polynomial. Set '0' to not include any multiplicative polynomials
  MC_PPXF : 0 # Number of Monte-Carlo simulations to extract errors on the stellar kinematics. Formal errors are saved in any case.
  LSF_TEMP : 'lsf_MILES' # Path of the file specifying the line-spread-function of the spectral templates. The specified path is relative to the configDir path in defaultDir.
  TEMPLATE_SET : 'miles' # options are 'miles' or 'IndoUS' or 'walcher'
  LIBRARY : 'EMILES_BASTI_BASE_CH_FITS/' # options are 'MILES/', 'miles_ssp_ch/', 'IndoUS', and 'Walcher/'
  NORM_TEMP : 'LIGHT' # Normalise the spectral template library to obtain light- or mass-weighted results [LIGHT / MASS]
  DOCLEAN : True # use pPXF clean routine which performs 3-sigma clipping based on the best-fit model [True / False]
  OPT_TEMP : 'default' # Keyword to select Optimal Template method. Options are 'default', 'galaxy_single', 'galaxy_set'
  DUST_CORR : True # True/False, fixes the dust in the final pPXF fit 
  NOISE : 'constant' # Keyword to set noise to be used in pPXF run. Option 'constant' and 'variance'
  PLOT : True # produce extra output plots
  DEBUG_BIN : False # Optional Keyword - array of bins [1,2,3] - only works when parallel = False. 
  
# Emission line fitting module
GAS :
  METHOD : False #'ppxf' # options are 'ppxf', 'gandalf' or 'MAGPI_gandalf' Name of the routine in emissionLines/ (without .py) to perform the tasks. Set 'False' to turn off module. Set 'gandalf' to use the standard GIST implementation, exploiting the pyGandALF routine of Sarzi et al. (2006).
  SPEC_MASK : 'specMask_GAS' 
  LEVEL : 'BIN' # Set 'BIN' to perform the analysis bin-by-bin, 'SPAXEL' for a spaxel-by-spaxel analysis, and 'BOTH' to perform a spaxel-by-spaxel analysis that is informed by a previous bin-by-bin analysis.
  LMIN : 4800 # Rest-frame wavelength range used for the emission-line analysis [in Angst.]
  LMAX : 7100
  ERRORS : 0 # Derive errors on the emission-line analysis (0 No / 1 Yes). Note: Due to limitations in pyGandALF, this is currently not possible. We expect a new pyGandALF version to be published soon.
  DUST_CORR : False # Include the effect of reddening by dust in the pyGandALF fit. Put in the form 0.1,0.1 without any spaces. If you intend to use multiplicative polynomials instead, set REDDENING to 'False' and add a MDEG keyword in the GAS section to set the polynomial order. Additive polynomials cannot be used with pyGandALF.
  MDEG : 8 # Degree of the multiplicative Legendre polynomial. Set '0' to not include any multiplicative polynomials.
  FIXED : True # Fix the stellar kinematics to the results obtained with the stellar kinematics module [True / False]
  MOM : 2 # Gas moments. Set to 2 for V and sigma. Higher orders not yet tested 
  EBmV : null # As opposed to None. De-redden the spectra for the Galactic extinction in the direction of the target previously to the analysis. Use e.g. EBmV = A_v / 3.2
  EMI_FILE : 'emissionLines_ppxf.config' # Emission line set-up file for emline fittet. The specified path is relative to the configDir path in defaultDir.  Set to 'emissionLines_ppxf.config' when using the 'ppxf' routine, and 'emissionLines_gandalf.config' when using the 'gandalf' routine.  
  LSF_TEMP : 'lsf_MILES' # Path of the file specifying the line-spread-function of the spectral templates. The specified path is relative to the configDir path in defaultDir.
  TEMPLATE_SET : 'miles' # options are 'miles' or 'IndoUS'
  LIBRARY : 'MILES_EMLINES/' # options are 'MILES_EMLINES/' (contains asmaller subset of templates sim to that used by PHANGS) 'MILES/', 'miles_ssp_ch', or 'IndoUS'
  NORM_TEMP : 'LIGHT' # Normalise the spectral template library to obtain light- or mass-weighted results [LIGHT / MASS]
  
# Star formation histories module
SFH :
  METHOD : 'ppxf' # Name of the routine in starFormationHistories/ (without .py) to perform the tasks. Set 'False' to turn off module. Set 'ppxf' to use the standard GIST implementation, exploiting the pPXF routine of Cappellari & Emsellem (2004).
  LMIN : 4750 # Rest-frame wavelength range used for the star formation histories analysis [in Angst.]
  LMAX : 8900
  SPEC_DUSTMASK : 'specMask_DUST'
  SPEC_MASK : 'specMask_KIN' 
  SPEC_EMICLEAN : False # Keyword (True/False) to enable/disable the use of emission line cleaned spectra from the Emission Line Fitting Module.  
  MOM : 4 # Number of kinematic moments to be extracted. If you use FIXED = True, this should be same number of moments used to extract the stellar kinematics before. Otherwise the parameter can be set independently. 
  MDEG : 23 # Degree of the multiplicative Legendre polynomial. Set '0' to not include any multiplicative polynomials. Note that additive Legendre polynomials cannot be used for this module. 
  REGUL : 0 # Regularisation error for the regularised run of pPXF. Note: Regularisation = 1 / REGUL_ERR
  FIXED : False # Fix the stellar kinematics to the results obtained with the stellar kinematics module [True / False]. If 'False', please provide an initial guess on the velocity dispersion of the systems [in km/s] by adding the parameter SIGMA. 
  MC_PPXF : 0 # Added to add the option of running MC on the SFH module
  LSF_TEMP : 'lsf_alphaMC_highres.txt' 
  TEMPLATE_SET : 'alphaMC' 
  LIBRARY : 'alphaMC/' 
  NORM_TEMP : 'LIGHT' # Normalise the spectral template library to obtain light- or mass-weighted results [LIGHT / MASS]
  DOCLEAN : True # use pPXF clean routine which performs 3-sigma clipping based on the best-fit model [True / False]
  OPT_TEMP : 'default' # Keyword to select Optimal Template method. Options are 'default', 'galaxy_single', 'galaxy_set'
  DUST_CORR : True # True/False, fixes the dust in the final pPXF fit 
  NOISE : 'variance' # Keyword to set noise to be used in pPXF run. Option 'constant' and 'variance'
  PLOT : True # produce extra output plots
  DEBUG_BIN : [1] # Optional Keyword - array of bins [1,2,3] - only works when parallel = False. 

# Line strenghts module
LS :
  METHOD : False # Name of the routine in lineStrengths/ (without .py) to perform the tasks. Set 'False' to turn off module. Set 'default' to use the standard GIST implementation, exploiting the routines of Kuntschner et al. (2006) and Martin-Navarro et al. (2018).
  TYPE : 'SPP' # Set 'LS' to only measure line strength indices, or 'SPP' to also match these indices to stellar population properties. 
  LS_FILE : 'lsBands.config' # File to define the wavelength band of the line strength indices to be measured. The specified path is relative to the configDir path in defaultDir.
  CONV_COR : 8.4 # Spectral resolution [in Angst.] at which the line strength indices are measured.
  SPP_FILE : 'MILES_CH_LIS8.4.fits' # File providing predictions on line strength indices for a set of single stellar population models
  MC_LS : 100 # Number of Monte-Carlo simulations in order to obtain errors on the line strength indices. Note: This must be turned on.
  NWALKER : 200 # Number of walkers for the MCMC algorithm (used for the conversion of indices to population properties)
  NCHAIN : 200 # Number of iterations in the MCMC algorithm (used for the conversion of indices to population properties)
  LSF_TEMP : 'lsf_MILES' # Path of the file specifying the line-spread-function of the spectral templates. The specified path is relative to the configDir path in defaultDir.
  TEMPLATE_SET : 'miles' # options are 'miles' or 'IndoUS'
  LIBRARY : 'MILES/' # options are 'MILES/', 'miles_ssp_ch/', or 'IndoUS/'
  NORM_TEMP : 'LIGHT' # Normalise the spectral template library to obtain light- or mass-weighted results [LIGHT / MASS]
  
UMOD:
  METHOD : False
